apiVersion: v1
kind: Namespace
metadata:
  name: agent
---
# 仅给保存工作区的节点打标签：kubectl label node <node> magent-workspace=true
# 在该节点创建 /workspace，并放入 models.json、config.toml 和 skills/。
apiVersion: v1
kind: PersistentVolume
metadata:
  name: agent-workspace
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /workspace
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - agent
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agent-workspace
  namespace: agent
spec:
  storageClassName: ""
  volumeName: agent-workspace
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: magent
  namespace: agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: magent
  namespace: agent
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: magent
  namespace: agent
subjects:
  - kind: ServiceAccount
    name: magent
    namespace: agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: magent
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: magent
  namespace: agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: magent
  template:
    metadata:
      labels:
        app: magent
    spec:
      nodeSelector:
        agent: "true"
      serviceAccountName: magent
      containers:
        - name: magent
          image: magent:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          # 部署前填写空值。
          env:
            - name: MAGENT_SERVER_HEADER
              value: ""
            - name: MAGENT_SERVER_SALT
              value: ""
            - name: MAGENT_STORAGE_DB
              value: "magent"
            - name: MAGENT_STORAGE_DSN
              value: ""
            - name: MAGENT_RUNTIME_TOKEN
              value: ""
            - name: MAGENT_RUNTIME_TOPIC_URL
              value: ""
            - name: MAGENT_RUNTIME_TOPIC_KEY
              value: ""
            - name: MAGENT_RUNTIME_TOPIC_MODEL
              value: ""
          readinessProbe:
            tcpSocket:
              port: http
          volumeMounts:
            - name: workspace
              mountPath: /app/workspace
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: agent-workspace
---
apiVersion: v1
kind: Service
metadata:
  name: agent
  namespace: agent
spec:
  clusterIP: None
  selector:
    agent: codex
  ports:
    - name: websocket
      port: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: magent
  namespace: agent
spec:
  type: NodePort
  selector:
    app: magent
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 31000
